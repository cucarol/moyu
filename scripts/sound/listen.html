<!doctype html>
<meta charset="utf-8" />
<title>moyu sound, offline</title>
<!-- Opened by listen.mjs in a muted headless Chrome: plays each job into an
     OfflineAudioContext and posts it back. Nothing plays out loud. -->
<script type="module">
  // a seeded Math.random, so every render is the same
  let seed = 20261030;
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  // the page's timers run on the render's clock: the tracks schedule their notes from
  // setTimeout and setInterval, and an offline render runs far faster than they would
  const realTimeout = window.setTimeout.bind(window);
  let now = 0;
  let nextId = 1;
  const timers = new Map();
  window.setTimeout = (fn, ms = 0, ...a) => (timers.set(nextId, { at: now + ms, fn: () => fn(...a) }), nextId++);
  window.setInterval = (fn, ms = 0, ...a) => (timers.set(nextId, { at: now + ms, every: Math.max(1, ms), fn: () => fn(...a) }), nextId++);
  window.clearTimeout = window.clearInterval = (id) => timers.delete(id);
  function tick(ms) {
    now = ms;
    for (;;) {
      let due = null;
      for (const [id, t] of timers) if (t.at <= ms && (!due || t.at < due[1].at)) due = [id, t];
      if (!due) return;
      const [id, t] = due;
      if (t.every) t.at += t.every;
      else timers.delete(id);
      t.fn();
    }
  }

  const RATE = 48000;
  const STEP = 1280 / RATE; // how often the timers run, on whole render quanta
  const post = (path, body) => fetch(path, { method: 'POST', body });
  try {
    const { SFX, VIBE_SFX, TRACKS, SYNTH_TRACKS, VOICES, makeEnv, setRadio, babble, loadPinyin } = await import('../../web/play/audio.js');
    const { default: choice } = await import('../../web/play/sounds/bgm/choice.js');
    const asChosen = JSON.stringify(choice);
    const jobs = await (await fetch('/jobs.json')).json();
    for (const job of jobs) {
      const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: Math.round(job.secs * RATE), sampleRate: RATE });
      timers.clear();
      now = 0;
      const E = makeEnv(ctx, ctx.destination);
      E.running = () => true;
      let stop = () => {};
      // (choice: { track: { layer: { voice: 'synth' | 'loop' } } } over choice.js, for this job)
      const was = JSON.parse(asChosen);
      for (const t of Object.keys(choice)) for (const l of Object.keys(choice[t])) Object.assign(choice[t][l], was[t][l], job.choice?.[t]?.[l]);
      if (job.track) {
        setRadio(!!job.radio); // (radio: the music out of the little radio, as ⚙ 收音机放音乐)
        // (voices: the synth's voices to play, as 'layer.voice'; all of them without)
        const plays = job.voices ? (layer, voice) => job.voices.includes(`${layer}.${voice}`) : undefined;
        const track = (job.synth ? SYNTH_TRACKS : TRACKS)[job.track](E, ctx.destination, plays);
        track.setTension(job.tension ?? 0);
        // (tensions: [[secs, x], ...], tension changing as it plays)
        for (const [secs, x] of job.tensions ?? []) setTimeout(() => track.setTension(x), secs * 1000);
        await track.ready;
        stop = () => track.stop();
      } else if (job.say) {
        // (say: a line in a voice, as the agent says it, with its mood)
        await loadPinyin();
        babble(E, 0.05, job.say, VOICES[job.voice ?? 'clawd'], { mood: job.mood });
      } else {
        // (vibe: that vibe's own version of the sound, as the casino's game end)
        (job.vibe ? VIBE_SFX[job.vibe] : SFX)[job.sfx](E, 0.05, job.args ?? {});
      }
      for (let t = STEP; t < job.secs; t += STEP) {
        ctx.suspend(t).then(() => {
          tick(ctx.currentTime * 1000);
          ctx.resume();
        });
      }
      const buf = await ctx.startRendering();
      stop();
      for (let c = 0; c < 2; c++) await post(`/out/${job.id}/${c}`, buf.getChannelData(c));
    }
    await post('/done', '');
  } catch (e) {
    await post('/error', String(e?.stack ?? e));
  }
</script>
