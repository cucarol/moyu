<!doctype html>
<!-- The PV's end card: under the word the fish make, on black, laid over the last of d-night.js
     with a screen blend, so only the type shows. All of it the game's pixel type (FusionPixel) at
     whole multiples of its 12px: the line in Clawd's shout style (cream, an orange drop), then
     the hosts it plays in, each with its own icon in pixels (Claude Code's Clawd, the DeepSeek
     Harness's whale), on one line. Time runs from the page's clock (the director renderer
     steps it); ?lang=zh-CN|en; ?t= freezes it. -->
<meta charset="utf-8">
<title>moyu PV end card</title>
<style>
  @font-face { font-family: FusionPixel; src: url('/web/play/fonts/fusion-pixel-12px-zh_hans.woff2') format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* in the gap between the fish's word (its y's tail ends about 750) and the raft (about 920) */
  #card { position: absolute; left: 0; right: 0; top: 770px; text-align: center; font-family: FusionPixel; white-space: nowrap; }
  #card > div { opacity: 0; }
  /* the line: glyph pixels 4 frame pixels, an orange drop one glyph pixel under it */
  .tag { font-size: 48px; line-height: 48px; color: #f6ead2; text-shadow: 0 4px #d97757; }
  .hosts { margin-top: 34px; font-size: 36px; line-height: 36px; color: #cfd8e6; }
  .hosts .by { color: #7f8ba0; margin-right: 15px; }
  .hosts .dot { color: #7f8ba0; margin: 0 12px; }
  .hosts svg { vertical-align: middle; margin: -6px 9px 0 0; }
</style>
<body>
<div id="card"></div>
<script>window.__vtReady = false;</script>
<script>
const q = new URLSearchParams(location.search);
const en = q.get('lang') === 'en';
document.documentElement.lang = en ? 'en' : 'zh-CN';

// the icons, pixel art drawn 3 frame pixels a pixel (the hosts' type is 12px x 3)
const ICONS = {
  // Claude Code's own logo, the CLI's Clawd, its block characters as pixels (cubicle/ui.js)
  clawd: { colors: { 1: '#d97757', 2: '#000' }, rows: [
    '...111111111111...',
    '...111111111111...',
    '...112111111211...',
    '...112111111211...',
    '.1111111111111111.',
    '.1111111111111111.',
    '...111111111111...',
    '...111111111111...',
    '....1.1....1.1....',
    '....1.1....1.1....',
  ] },
  // DSH's own app icon, the DeepSeek whale, brought down to 14 rows; DeepSeek blue, as the icon's dark
  // whale would be lost on the black
  whale: { colors: { 1: '#4d6bfe' }, rows: [
    '........11...1.....',
    '...111111....11...1',
    '..11111111...111111',
    '.1111111111..11111.',
    '111111111111..111..',
    '1....11111111111...',
    '1.....1111..1111...',
    '11.....111111111...',
    '11......1111111....',
    '.11......111111....',
    '.11...1...1111.....',
    '..111.111..111.....',
    '...111111111111....',
    '.....11111.........',
  ] },
};
// an inline svg of square cells (a canvas here comes out blank in the renderer)
function icon(name, s = 3) {
  const { colors, rows } = ICONS[name];
  const w = rows[0].length, h = rows.length;
  const cells = rows.flatMap((r, y) => [...r].map((v, x) => (v === '.' ? '' : `<rect x="${x}" y="${y}" width="1" height="1" fill="${colors[v]}"/>`)));
  return `<svg width="${w * s}" height="${h * s}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${cells.join('')}</svg>`;
}

const lines = en
  ? [['tag', 'Slack off with your agent!'], ['hosts', `<span class="by">Plays in</span>${icon('clawd')}Claude Code<span class="dot">·</span>${icon('whale')}DSH`]]
  : [['tag', '和你的 Agent 一起摸鱼！'], ['hosts', `<span class="by">支持</span>${icon('clawd')}Claude Code<span class="dot">·</span>${icon('whale')}DSH`]];
const card = document.getElementById('card');
card.innerHTML = lines.map(([c, h]) => `<div class="${c}">${h}</div>`).join('');

const clamp = (v) => Math.max(0, Math.min(1, v));
// the line pops up, then the hosts rise in a beat after; all of it fades out at the end
const AT = [0.3, 0.9], END = 5.0;
const backOut = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
function frame(t) {
  const out = 1 - clamp((t - (END - 0.9)) / 0.8);
  [...card.children].forEach((el, i) => {
    const u = clamp((t - AT[i]) / (i ? 0.7 : 0.3)), k = 1 - (1 - u) ** 3;
    el.style.opacity = ((i ? k : u > 0 ? 1 : 0) * out).toFixed(3);
    // the line pops like Clawd's shouts; the rest rises a little, on whole pixels
    el.style.transform = i ? `translateY(${Math.round((1 - k) * 12)}px)` : `scale(${backOut(u).toFixed(3)})`;
  });
}
let t0 = null;
function loop(now) {
  if (t0 === null) t0 = now;
  frame(q.has('t') ? Number(q.get('t')) : (now - t0) / 1000);
  requestAnimationFrame(loop);
}
document.fonts.load('12px FusionPixel').finally(() => {
  window.__vtReady = true;
  requestAnimationFrame(loop);
});
</script>
</body>
