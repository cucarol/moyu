<!doctype html>
<meta charset="utf-8" />
<title>moyu PV score</title>
<!-- Opened by render.mjs in a muted headless Chrome: renders the score offline and posts
     its channels back. Nothing plays out loud. -->
<script type="module">
  // a seeded Math.random before anything else runs, so every render is the same
  const SEED = 20261030;
  let s = SEED;
  Math.random = () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const post = (path, body) => fetch(path, { method: 'POST', body });
  const solo = new URLSearchParams(location.search).get('solo');
  try {
    const { renderScore, renderSolo, EVENTS } = await import('./score.js');
    if (solo) {
      // ?solo=keys,bass,...: each part alone, every one from the same seed as the full
      // render, so each plays the full render's notes
      for (const part of solo.split(',')) {
        s = SEED;
        const buf = await renderSolo(part);
        for (let c = 0; c < 2; c++) await post(`/solo/${part}/${c}`, buf.getChannelData(c));
      }
      await post('/done', JSON.stringify({ solo }));
    } else {
      const buf = await renderScore();
      for (let c = 0; c < buf.numberOfChannels; c++) await post(`/out/${c}`, buf.getChannelData(c));
      await post('/events', JSON.stringify(EVENTS));
      await post('/done', JSON.stringify({ sampleRate: buf.sampleRate, length: buf.length, channels: buf.numberOfChannels }));
    }
  } catch (e) {
    await post('/error', String(e?.stack ?? e));
  }
</script>
