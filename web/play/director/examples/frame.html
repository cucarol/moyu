<!doctype html>
<!-- An example page that holds another in an iframe (docs/director.md): render.mjs --page
     renders it with one clock and one sound for both. A title over the terminal. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Pixel; src: url(/web/play/fonts/fusion-pixel-12px-zh_hans.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: Pixel, monospace; }
  iframe { position: absolute; left: 50%; top: 54%; width: 960px; height: 600px; transform: translate(-50%, -50%); border: 4px solid #2f9f78; background: #031410; }
  h1 { position: absolute; left: 0; right: 0; top: 60px; margin: 0; text-align: center; color: #f0e8d0; font-size: 56px; font-weight: normal; animation: rise 1.2s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
</style>
</head>
<body>
<h1>moyu · director</h1>
<iframe src="terminal.html"></iframe>
</body>
</html>
